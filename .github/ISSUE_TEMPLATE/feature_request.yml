name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: [feature]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please fill out the template below.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Limitation
      description: What problem does this solve? What is frustrating or missing today?
      placeholder: "I want to be able to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work?
      placeholder: "The app should..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've considered?
      placeholder: "I tried using... but..."
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, use cases, or anything else
